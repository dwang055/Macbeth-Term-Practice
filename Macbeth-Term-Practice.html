<script>
const UNITS = [{"id": "m01", "order": 1, "chapter": "The Weird Sisters", "stage": "Act 1, Scene 1 — Exposition — a supernatural frame", "summary": "Three witches meet on a bare heath amid thunder and lightning, agreeing to reconvene 'when the battle's lost and won' to meet Macbeth. The scene is brief but sets a disorienting, paradoxical tone for the whole play, closing with the witches' chant 'Fair is foul, and foul is fair,' which announces that appearances throughout the play will not be trusted.", "vocab": [{"term": "paradox", "def": "A statement that seems self-contradictory but reveals a deeper truth, e.g. 'fair is foul, and foul is fair.'"}, {"term": "pathetic fallacy", "def": "Attributing human or ominous qualities to nature/weather to reflect mood, e.g. the thunder and lightning."}, {"term": "prophecy", "def": "A prediction of future events, often treated as supernatural or divinely inspired."}], "short_answer": [{"q": "Analyse how Shakespeare creates an unsettling atmosphere in this brief opening scene.", "guidance": ["Consider the stage directions (thunder, lightning) and setting (a bare heath)", "Comment on the effect of the witches speaking in short, chant-like lines"]}, {"q": "Explain the significance of the line 'Fair is foul, and foul is fair.'", "guidance": ["Consider how this paradox might apply to Macbeth himself later in the play", "Link to the theme of appearance versus reality"]}, {"q": "Discuss why Shakespeare chooses to open the play with the witches rather than with Macbeth or Duncan.", "guidance": ["Consider what expectations this creates for the audience", "Think about genre — how does this opening signal tragedy or the supernatural"]}, {"q": "Explore the effect of the witches' rhyming, incantatory verse form in this scene.", "guidance": ["Note the trochaic rhythm and rhyme compared to other characters' later speech", "Consider what this form suggests about their otherworldliness"]}], "essays": [{"q": "By what methods does Shakespeare use the opening scene to establish key concerns that will run throughout the play?", "guidance": ["Focus on specific dramatic techniques (form, staging, language) rather than plot summary", "Trace at least one idea from this scene forward into a later moment in the play", "Consider the effect on a first-time audience versus a returning reader/viewer"]}]}, {"id": "m02", "order": 2, "chapter": "The Bleeding Captain's Report", "stage": "Act 1, Scene 2 — Establishing Macbeth's valor", "summary": "A wounded Captain reports to King Duncan on the battle against the rebel Macdonwald and the invading Norwegians, praising Macbeth's ferocious, almost superhuman bravery ('brave Macbeth — well he deserves that name'). Duncan learns that the treacherous Thane of Cawdor has been defeated and orders his title given to Macbeth, unaware of the irony that he is rewarding one traitor's title to a future one.", "vocab": [{"term": "dramatic irony", "def": "When the audience knows something a character does not — here, that 'brave Macbeth' will become a traitor himself."}, {"term": "hyperbole", "def": "Deliberate exaggeration for effect, used to describe Macbeth's violence in battle."}, {"term": "martial imagery", "def": "Language and imagery relating to war and combat."}], "short_answer": [{"q": "Analyse how the Captain's report characterises Macbeth before he even appears on stage.", "guidance": ["Select a specific violent image used to describe Macbeth", "Consider the effect of hearing about Macbeth secondhand rather than meeting him directly"]}, {"q": "Explain the dramatic irony in Duncan's decision to give Macbeth the title of Thane of Cawdor.", "guidance": ["Consider what the audience later learns about both Cawdor and Macbeth", "Comment on Duncan's judgement of character here"]}, {"q": "Discuss the effect of the graphic, violent imagery used in the Captain's account.", "guidance": ["Find a specific example of visceral or bloody language", "Consider how this foreshadows imagery used later in the play"]}, {"q": "Explore what this scene suggests about Duncan as a king and judge of character.", "guidance": ["Consider his reliance on secondhand reports rather than direct observation", "Link to his later trust in Macbeth"]}], "essays": [{"q": "Explore how Shakespeare uses the Captain's report to foreshadow Macbeth's tragic trajectory.", "guidance": ["Identify specific images or phrases that gain new meaning in light of later events", "Consider the significance of introducing Macbeth through others' words rather than his own", "Address how this shapes the audience's initial view of Macbeth as heroic"]}]}, {"id": "m03", "order": 3, "chapter": "The Prophecy on the Heath", "stage": "Act 1, Scene 3 — The witches meet Macbeth and Banquo", "summary": "Macbeth and Banquo encounter the witches, who hail Macbeth as Thane of Glamis, Thane of Cawdor, and future king, and tell Banquo his descendants will be kings though he himself will not. Macbeth is visibly shaken; when Ross arrives confirming his new title of Cawdor, the first prophecy proves true, and Macbeth begins to entertain 'horrible imaginings' about how he might become king.", "vocab": [{"term": "equivocation", "def": "Speech that is deliberately ambiguous or misleading while technically true."}, {"term": "aside", "def": "A short speech directed to the audience, unheard by other characters onstage, revealing private thought."}, {"term": "soliloquy", "def": "An extended speech, often alone onstage, revealing a character's inner thoughts to the audience."}], "short_answer": [{"q": "Analyse Macbeth's reaction to the witches' prophecy in his aside.", "guidance": ["Find a specific phrase revealing his fear or ambition", "Consider what this reveals about thoughts he has not yet admitted to himself"]}, {"q": "Explain the significance of Banquo's prophecy compared to Macbeth's.", "guidance": ["Consider the difference between 'king' and 'father of kings'", "Think about how this sets up a contrast between the two characters' responses"]}, {"q": "Discuss how the confirmation of the Cawdor title affects Macbeth's state of mind.", "guidance": ["Consider why one true prophecy makes the rest seem more credible", "Link to the idea of temptation"]}, {"q": "Explore how Shakespeare uses the phrase 'horrible imaginings' to characterise Macbeth's inner conflict.", "guidance": ["Consider what this phrase suggests he is already imagining", "Comment on the tension between ambition and conscience"]}], "essays": [{"q": "To what extent does this scene suggest that Macbeth's downfall originates in the witches' prophecy rather than in his own ambition?", "guidance": ["Consider both the witches' role and Macbeth's own reaction as separate contributing factors", "Use specific evidence from Macbeth's asides to assess his state of mind before any prophecy is confirmed", "Address a counter-argument: could the prophecy simply be naming a desire already present?"]}]}, {"id": "m04", "order": 4, "chapter": "The Prince of Cumberland", "stage": "Act 1, Scene 4 — Duncan's court; Macbeth's private ambition surfaces", "summary": "Duncan hears of the former Thane of Cawdor's honourable execution and welcomes Macbeth and Banquo warmly, then names his own son Malcolm as Prince of Cumberland — his heir. This announcement is a direct obstacle to Macbeth's ambitions, and in a private aside he admits his 'black and deep desires' and asks the stars to hide themselves so his true thoughts remain unseen.", "vocab": [{"term": "succession", "def": "The order in which a title, especially a crown, passes from one holder to the next."}, {"term": "obstacle (dramatic function)", "def": "An event or decision that stands in the way of a character achieving their goal, driving further action."}, {"term": "foil", "def": "A character whose qualities highlight another's by contrast — here, Malcolm's naming contrasts with Macbeth's ambition."}], "short_answer": [{"q": "Analyse the significance of Duncan naming Malcolm Prince of Cumberland at this specific moment.", "guidance": ["Consider the timing relative to the witches' prophecy", "Explain why this creates a concrete obstacle for Macbeth"]}, {"q": "Explain what Macbeth's aside about 'black and deep desires' reveals about his moral awareness.", "guidance": ["Consider that he asks to hide his thoughts even from himself/the stars", "Discuss what this suggests about his conscience at this stage"]}, {"q": "Discuss the dramatic irony of Duncan's praise for Macbeth immediately before this aside.", "guidance": ["Find Duncan's specific words of trust or affection", "Contrast this with what the audience has just learned about Macbeth's thoughts"]}, {"q": "Explore how Duncan is characterised in this scene through his treatment of both the former Cawdor and Macbeth.", "guidance": ["Consider his comments on how difficult it is to read a person's true nature", "Note the irony given what follows"]}], "essays": [{"q": "By what methods does Shakespeare present the growing gap between Macbeth's public behaviour and private thoughts in this scene?", "guidance": ["Focus on the technique of the aside and its dramatic effect", "Compare Macbeth's public words to Duncan with his private aside", "Consider what this gap suggests about the psychological cost of ambition to come"]}]}, {"id": "m05", "order": 5, "chapter": "Lady Macbeth's Invocation", "stage": "Act 1, Scene 5 — Inverness — Lady Macbeth resolves to act", "summary": "Lady Macbeth reads Macbeth's letter describing the prophecy and immediately resolves that he shall be king, though she fears he is 'too full o' th' milk of human kindness' to act ruthlessly. On learning Duncan will visit that night, she invokes spirits to 'unsex' her and fill her with cruelty, then greets Macbeth and urges him to hide his true intentions behind a welcoming face.", "vocab": [{"term": "invocation", "def": "A formal appeal or address, often to a god or spirit, calling on supernatural power."}, {"term": "gender inversion", "def": "The reversal of expected gender roles or qualities, as Lady Macbeth asks to be made less 'feminine' in the play's terms."}, {"term": "foreshadowing", "def": "Hints or clues about events that will occur later in the narrative."}], "short_answer": [{"q": "Analyse how Lady Macbeth characterises her husband in her opening soliloquy.", "guidance": ["Consider the phrase 'milk of human kindness' and what it implies", "Explain how this shapes her plan for how to persuade him"]}, {"q": "Explain the significance of Lady Macbeth's invocation to the spirits.", "guidance": ["Consider what specifically she asks to be changed about herself", "Discuss what this reveals about her view of femininity and violence"]}, {"q": "Discuss how Shakespeare uses imperative verbs and violent imagery in this speech.", "guidance": ["Select a specific commanding phrase", "Explain the effect of this forceful language on the audience's view of her"]}, {"q": "Explore the significance of Lady Macbeth's advice to Macbeth to 'look like th' innocent flower, but be the serpent under't.'", "guidance": ["Consider what this reveals about the theme of appearance versus reality", "Link to the witches' 'fair is foul' from the opening scene"]}], "essays": [{"q": "Explore how Shakespeare presents Lady Macbeth's ambition and its relationship to ideas of gender in this scene.", "guidance": ["Analyse the invocation speech closely, addressing specific language choices", "Consider how this scene sets up her dynamic with Macbeth for the rest of the play", "Address the historical/Jacobean context of gender expectations where relevant"]}]}, {"id": "m06", "order": 6, "chapter": "Duncan Arrives at Inverness", "stage": "Act 1, Scene 6 — Dramatic irony at the castle gates", "summary": "Duncan and his party arrive at Inverness, and Duncan and Banquo comment on the pleasant, welcoming atmosphere of the castle, noting the birds nesting there as a sign of good air. Lady Macbeth greets Duncan with elaborate courtesy and hospitality, concealing entirely the murderous plan already underway, in one of the play's starkest instances of dramatic irony.", "vocab": [{"term": "dramatic irony", "def": "A gap between what characters know and what the audience knows, heightening tension."}, {"term": "hospitality (thematic)", "def": "The social and moral duty of a host to protect a guest, violated by the plot to kill Duncan."}, {"term": "situational irony", "def": "An outcome that is strikingly different from — often opposite to — what is expected."}], "short_answer": [{"q": "Analyse the effect of Duncan's comments about the castle's pleasant atmosphere.", "guidance": ["Consider the imagery of birds and clean air he uses", "Explain the irony given what the audience already knows"]}, {"q": "Explain how Lady Macbeth's language of welcome contributes to the scene's dramatic irony.", "guidance": ["Find a specific phrase of exaggerated courtesy", "Contrast this with her soliloquy in the previous scene"]}, {"q": "Discuss the significance of hospitality as a value being violated in this scene.", "guidance": ["Consider Duncan's status as both king and guest", "Link to Macbeth's own later reflection on this duty in the next scene"]}, {"q": "Explore how brevity and courtly language are used to build tension in this short scene.", "guidance": ["Consider what is left unsaid rather than said", "Comment on the effect of formal, polite dialogue masking violent intent"]}], "essays": [{"q": "By what methods does Shakespeare use dramatic irony in this scene to build tension ahead of Duncan's murder?", "guidance": ["Focus closely on specific lines of praise/welcome and their ironic undertones", "Consider staging — who is present, what is visible to whom", "Connect this scene's irony to the play's wider concern with appearance versus reality"]}]}, {"id": "m07", "order": 7, "chapter": "‘If it were done...’", "stage": "Act 1, Scene 7 — Macbeth's crisis of conscience", "summary": "Alone, Macbeth weighs the consequences of murdering Duncan, listing reasons against the act — kinship, duty as host, Duncan's virtue — and concluding only 'vaulting ambition' drives him forward. When Lady Macbeth enters and finds him wavering, she questions his manhood and courage, outlines a detailed plan to frame Duncan's chamberlains, and persuades him to proceed.", "vocab": [{"term": "soliloquy", "def": "A speech delivered alone onstage, revealing a character's private thoughts directly to the audience."}, {"term": "vaulting ambition", "def": "Macbeth's own phrase for excessive, overreaching ambition that outstrips its own justification."}, {"term": "manipulation", "def": "Influencing someone's behaviour through pressure, guilt, or persuasion rather than honest argument."}], "short_answer": [{"q": "Analyse the structure of Macbeth's soliloquy — how does his reasoning develop across the speech?", "guidance": ["Trace the argument from consequence, to duty, to his final admission", "Comment on the shift in tone by the end"]}, {"q": "Explain the significance of the phrase 'vaulting ambition, which o'erleaps itself.'", "guidance": ["Consider the horse-riding metaphor and what it implies about overreach", "Link to Macbeth's own awareness that this is his only motive"]}, {"q": "Discuss how Lady Macbeth persuades Macbeth to continue with the murder.", "guidance": ["Identify specific tactics she uses (questioning his manhood, practicality of the plan)", "Consider the power dynamic between them in this exchange"]}, {"q": "Explore what this scene reveals about Macbeth's moral awareness before the murder.", "guidance": ["Consider that he lists Duncan's virtues and his own duties clearly", "Discuss whether this makes his eventual choice more or less tragic"]}], "essays": [{"q": "Explore how Shakespeare presents the conflict between conscience and ambition in this scene, and consider its significance for the play as a whole.", "guidance": ["Analyse both Macbeth's soliloquy and the persuasion scene with Lady Macbeth as two distinct techniques", "Use precise textual evidence for Macbeth's stated objections to the murder", "Consider how this internal conflict sets up patterns of guilt explored later in the play"]}]}, {"id": "m08", "order": 8, "chapter": "The Dagger Soliloquy", "stage": "Act 2, Scene 1 — The night of the murder begins", "summary": "Banquo, uneasy and unable to sleep, encounters Macbeth in the castle courtyard and mentions the witches' prophecy with guarded suspicion before retiring. Left alone, Macbeth hallucinates a dagger floating before him, pointing toward Duncan's chamber, and delivers a tense soliloquy grappling with the vision before the bell signals it is time to commit the murder.", "vocab": [{"term": "hallucination", "def": "A perception of something not actually present, often signalling psychological strain."}, {"term": "apostrophe (rhetorical device)", "def": "Directly addressing an absent or imaginary object or person — here, the dagger."}, {"term": "psychological realism", "def": "The believable depiction of a character's inner mental and emotional state."}], "short_answer": [{"q": "Analyse how Shakespeare uses the dagger hallucination to reveal Macbeth's psychological state.", "guidance": ["Consider what the hallucination suggests about his guilt before the murder even occurs", "Comment on his own uncertainty about whether it is real"]}, {"q": "Explain the significance of Banquo's mention of the witches in this scene.", "guidance": ["Consider his cautious, guarded tone compared to Macbeth's earlier excitement", "Link to Banquo's growing unease about Macbeth"]}, {"q": "Discuss the effect of the bell as a structural device at the end of the scene.", "guidance": ["Consider what the bell signifies practically and symbolically", "Comment on the abruptness it brings to the soliloquy"]}, {"q": "Explore how imagery of blood in this soliloquy anticipates later scenes.", "guidance": ["Find the specific line referencing blood on the dagger", "Link forward to Macbeth's and Lady Macbeth's later preoccupation with blood"]}], "essays": [{"q": "By what methods does Shakespeare dramatise Macbeth's psychological state in the moments before Duncan's murder?", "guidance": ["Focus on the soliloquy's imagery, syntax, and rhetorical questions as specific techniques", "Consider the function of the dagger as a symbol rather than simply a plot device", "Address how this scene establishes a pattern of guilt-driven imagination that recurs later"]}]}, {"id": "m09", "order": 9, "chapter": "The Murder of Duncan", "stage": "Act 2, Scene 2 — The act itself, offstage", "summary": "Lady Macbeth, having drugged Duncan's guards, waits anxiously while Macbeth commits the murder offstage. He returns deeply shaken, obsessively fixated on having heard a voice cry 'Sleep no more!' and unable to say 'Amen' to a prayer, while Lady Macbeth, more composed, returns the daggers to frame the guards and reassures him that 'a little water clears us of this deed.'", "vocab": [{"term": "offstage action", "def": "An event that occurs out of the audience's view, often to heighten horror through implication rather than spectacle."}, {"term": "guilt (thematic)", "def": "A recurring psychological and moral burden following wrongdoing, dramatised throughout the play."}, {"term": "dramatic contrast", "def": "Placing two characters' reactions side by side to highlight difference."}], "short_answer": [{"q": "Analyse the effect of staging Duncan's murder offstage rather than showing it directly.", "guidance": ["Consider what this choice allows the audience to imagine instead of see", "Discuss the effect of focusing on Macbeth's reaction rather than the act itself"]}, {"q": "Explain the significance of Macbeth's inability to say 'Amen.'", "guidance": ["Consider what this suggests about his spiritual state immediately after the murder", "Link to the theme of sleep and conscience introduced by the voice he hears"]}, {"q": "Discuss the contrast between Macbeth's and Lady Macbeth's reactions in this scene.", "guidance": ["Find specific lines showing his horror versus her composure", "Consider what this contrast suggests about each character at this point"]}, {"q": "Explore the significance of Lady Macbeth's line 'a little water clears us of this deed.'", "guidance": ["Consider the irony given her sleepwalking scene later in the play", "Link to the broader motif of blood and guilt"]}], "essays": [{"q": "Explore how Shakespeare uses this scene to begin establishing guilt as a central psychological and dramatic force in the play.", "guidance": ["Analyse specific imagery (sleep, blood, prayer) as recurring motifs beginning here", "Compare Macbeth's and Lady Macbeth's differing responses as evidence of contrasting psychological trajectories", "Consider how this scene sets up their eventual reversal of roles later in the play"]}]}, {"id": "m10", "order": 10, "chapter": "Discovery and the Porter", "stage": "Act 2, Scene 3 — Comic relief and the murder's discovery", "summary": "A drunken Porter, imagining himself the gatekeeper of hell, delivers a comic monologue before admitting Macduff and Lennox. Macduff discovers Duncan's murdered body, and in the chaos that follows, Macbeth kills the drugged guards, claiming grief-driven rage, while Malcolm and Donalbain, fearing for their own lives, quietly resolve to flee Scotland.", "vocab": [{"term": "comic relief", "def": "A humorous scene or moment inserted into a serious or tragic work to relieve tension."}, {"term": "hell-gate imagery", "def": "Imagery comparing a location or situation to the entrance of hell, used here by the Porter."}, {"term": "suspicion (dramatic function)", "def": "A character's growing doubt about another, often expressed indirectly through hesitation or subtext."}], "short_answer": [{"q": "Analyse the function of the Porter's comic scene at this point in the play.", "guidance": ["Consider the effect of humour immediately after Duncan's murder", "Discuss the significance of his 'hell-gate' imagery"]}, {"q": "Explain why Macbeth's killing of the guards might be seen as suspicious rather than simply grief-driven.", "guidance": ["Consider the practical convenience of silencing potential witnesses", "Note how Macduff or others might interpret this act"]}, {"q": "Discuss the significance of Malcolm and Donalbain's decision to flee.", "guidance": ["Consider their stated reasoning versus how this decision will later be used against them", "Link to the theme of appearance versus guilt"]}, {"q": "Explore how Macduff's language upon discovering the body conveys the horror of the murder.", "guidance": ["Find a specific exclamation or metaphor he uses", "Consider the effect of religious or apocalyptic language here"]}], "essays": [{"q": "By what methods does Shakespeare balance horror and comedy in this scene, and what is the effect of this combination?", "guidance": ["Address the Porter's comic monologue as a distinct technique from the surrounding tragedy", "Consider how tonal contrast can heighten, rather than relieve, tension for an audience", "Use specific evidence from both the comic and tragic elements of the scene"]}]}, {"id": "m11", "order": 11, "chapter": "Omens and Suspicion", "stage": "Act 2, Scene 4 — The natural order disrupted", "summary": "Ross and an old man discuss unnatural events since the murder — darkness at midday, a falcon killed by an owl, Duncan's horses turning wild and eating each other — presenting nature itself as disturbed by the regicide. Macduff reveals that suspicion has fallen on the fled princes, and that Macbeth has already been named king and gone to be crowned, while Macduff himself declines to attend, choosing instead to return home to Fife.", "vocab": [{"term": "pathetic fallacy", "def": "Nature reflecting or reacting to human moral disorder, used extensively after the regicide."}, {"term": "regicide", "def": "The killing of a king, considered an especially severe crime, believed to disrupt the natural and cosmic order."}, {"term": "the Great Chain of Being", "def": "A Renaissance-era belief in a fixed, divinely ordained hierarchy linking God, monarchs, humans, animals, and nature."}], "short_answer": [{"q": "Analyse how the unnatural events described in this scene reflect the play's wider themes.", "guidance": ["Select one specific unnatural event (e.g. the horses)", "Explain how it connects disorder in nature to disorder in the political/moral order"]}, {"q": "Explain the significance of suspicion falling on Malcolm and Donalbain rather than Macbeth.", "guidance": ["Consider how their flight, though understandable, is interpreted as guilt", "Link to the theme of appearance versus reality"]}, {"q": "Discuss the significance of Macduff's decision not to attend Macbeth's coronation.", "guidance": ["Consider what this early hesitation foreshadows about his character", "Note his choice to return home rather than support the new king"]}, {"q": "Explore how this scene uses secondhand report, rather than direct action, to convey major plot developments.", "guidance": ["Consider the effect of learning about the coronation through dialogue rather than seeing it staged", "Discuss what this choice achieves dramatically"]}], "essays": [{"q": "Explore how Shakespeare uses the idea of a disrupted natural order in this scene to comment on the consequences of regicide.", "guidance": ["Draw on the Jacobean belief in the Great Chain of Being as relevant context", "Analyse specific images of disorder in nature as your primary evidence", "Consider how this idea connects to disorder elsewhere in the play (e.g. Scotland's suffering under Macbeth)"]}]}, {"id": "m12", "order": 12, "chapter": "Banquo's Suspicion", "stage": "Act 3, Scene 1 — Macbeth turns against his former ally", "summary": "Now king, Macbeth is haunted by Banquo's prophecy that his descendants, not Macbeth's, will inherit the throne. In a soliloquy he admits fearing Banquo's 'royalty of nature' and resolves to eliminate the threat, manipulating two murderers by convincing them Banquo has wronged them, in order to arrange Banquo's — and his son Fleance's — murder.", "vocab": [{"term": "paranoia", "def": "Excessive, often irrational suspicion or fear, especially of being undermined by others."}, {"term": "manipulation (rhetorical)", "def": "Shaping another person's beliefs or emotions through persuasive but self-serving language."}, {"term": "barren sceptre", "def": "Macbeth's own image for a kingship that will not be passed to his own children."}], "short_answer": [{"q": "Analyse Macbeth's soliloquy expressing fear of Banquo.", "guidance": ["Consider the phrase 'royalty of nature' and what it reveals about Macbeth's insecurity", "Discuss the shift from ambition to paranoia in his character"]}, {"q": "Explain how Macbeth manipulates the murderers to act against Banquo.", "guidance": ["Identify the specific persuasive technique he uses (blaming Banquo for their misfortunes)", "Consider what this reveals about Macbeth's growing skill at manipulation"]}, {"q": "Discuss the significance of the phrase 'fruitless crown' and 'barren sceptre' in this soliloquy.", "guidance": ["Consider what these images suggest about Macbeth's view of his own kingship", "Link to his fear of Banquo's descendants"]}, {"q": "Explore how this scene marks a turning point in Macbeth's moral character.", "guidance": ["Consider the shift from reluctant murderer to calculating plotter", "Compare his hesitation in Act 1 to his resolve here"]}], "essays": [{"q": "By what methods does Shakespeare present Macbeth's transformation from reluctant regicide to calculating tyrant in this scene?", "guidance": ["Trace specific changes in Macbeth's language and reasoning compared to earlier scenes", "Analyse the manipulation of the murderers as evidence of this shift", "Consider what this transformation suggests about the corrupting effect of power and guilt"]}]}, {"id": "m13", "order": 13, "chapter": "‘Full of Scorpions is My Mind’", "stage": "Act 3, Scene 2 — Macbeth and Lady Macbeth's isolation deepens", "summary": "Lady Macbeth confesses privately that their gains feel hollow — 'nought's had, all's spent' — while trying to comfort a distracted, anguished Macbeth. He refuses to tell her of his plan against Banquo, saying her mind should stay 'innocent of the knowledge' until the deed is done, revealing a growing emotional distance between them as guilt and paranoia consume him.", "vocab": [{"term": "dramatic irony", "def": "Here, the audience senses the couple's growing isolation from each other even as they try to reassure one another."}, {"term": "emotional estrangement", "def": "A growing distance or disconnect between characters who were previously close."}, {"term": "scorpions (imagery)", "def": "Macbeth's image for his tormented, anxious mind, full of imagined stinging threats."}], "short_answer": [{"q": "Analyse the significance of Lady Macbeth's line 'nought's had, all's spent.'", "guidance": ["Consider what this reveals about her state of mind now that the crown is achieved", "Link to the theme of the emptiness of ambition once fulfilled"]}, {"q": "Explain why Macbeth chooses not to tell Lady Macbeth about his plan for Banquo.", "guidance": ["Consider his stated reason and what it reveals about their changing relationship", "Discuss the shift in power/knowledge between them"]}, {"q": "Discuss the effect of the scorpion imagery Macbeth uses to describe his mind.", "guidance": ["Consider the sensory and physical quality of this image", "Link to his earlier soliloquies about guilt and fear"]}, {"q": "Explore how this scene marks a shift in the balance of power between Macbeth and Lady Macbeth.", "guidance": ["Compare her persuasive dominance in Act 1 with her more passive role here", "Consider what this shift foreshadows for her character later in the play"]}], "essays": [{"q": "Explore how Shakespeare presents the growing psychological distance between Macbeth and Lady Macbeth in this scene.", "guidance": ["Analyse specific language choices revealing each character's isolation", "Consider the dramatic significance of secrets now being kept between them", "Connect this shift to their eventual, separate downfalls later in the play"]}]}, {"id": "m14", "order": 14, "chapter": "The Murder of Banquo", "stage": "Act 3, Scene 3 — The plot succeeds only in part", "summary": "The hired murderers ambush Banquo and Fleance in the dark; Banquo is killed, but Fleance escapes, undermining Macbeth's attempt to prevent the witches' prophecy about Banquo's descendants from coming true. This partial failure introduces a new, uncontrollable threat to Macbeth's rule.", "vocab": [{"term": "dramatic tension", "def": "A feeling of suspense created by uncertainty about the outcome of events."}, {"term": "foil (plot device)", "def": "An event that thwarts or partially undoes a character's plan."}, {"term": "third murderer", "def": "An unexplained additional murderer some productions interpret as sent by Macbeth to watch the others."}], "short_answer": [{"q": "Analyse how Shakespeare builds tension in this brief but pivotal scene.", "guidance": ["Consider the use of darkness and short, urgent lines of dialogue", "Comment on the pacing compared to earlier, longer scenes"]}, {"q": "Explain the significance of Fleance's escape for the rest of the play.", "guidance": ["Consider what this means for the witches' prophecy about Banquo's line", "Discuss why this represents a failure for Macbeth despite Banquo's death"]}, {"q": "Discuss the possible significance of the mysterious 'third murderer' in this scene.", "guidance": ["Consider the ambiguity of his identity and what different interpretations might suggest about Macbeth's trust in others", "Note how this ambiguity has been staged differently across productions"]}, {"q": "Explore how this scene contributes to the play's exploration of fate versus free will.", "guidance": ["Consider whether Fleance's survival suggests fate cannot be fully controlled", "Link to Macbeth's ongoing attempts to control his own prophesied future"]}], "essays": [{"q": "By what methods does Shakespeare use this scene to develop the theme of fate versus free will?", "guidance": ["Focus on Fleance's escape as central evidence for your argument", "Consider Macbeth's attempt to control prophecy through violent action", "Address how this partial failure affects Macbeth's psychological state in subsequent scenes"]}]}, {"id": "m15", "order": 15, "chapter": "The Banquet and the Ghost", "stage": "Act 3, Scene 4 — Public unraveling", "summary": "At a royal banquet, a murderer privately informs Macbeth of Banquo's death and Fleance's escape, and Macbeth, visibly disturbed, then sees Banquo's ghost sitting in his own seat, invisible to the other guests. His erratic, terrified outbursts alarm the court; Lady Macbeth attempts to cover for him, but the ghost's second appearance forces her to end the banquet abruptly, and Macbeth resolves to consult the witches again.", "vocab": [{"term": "hallucination", "def": "A perception of something not present, here interpreted by some as a manifestation of guilt."}, {"term": "public versus private self", "def": "The contrast between a character's controlled public behaviour and their uncontrolled private state."}, {"term": "catalyst", "def": "An event that provokes significant change or crisis in a narrative."}], "short_answer": [{"q": "Analyse how Macbeth's language changes when he sees Banquo's ghost.", "guidance": ["Compare his composed public speech before the vision to his fragmented speech during it", "Consider what this shift reveals about his loss of control"]}, {"q": "Explain how Lady Macbeth attempts to manage the crisis at the banquet.", "guidance": ["Consider her specific excuses to the guests", "Discuss what this reveals about her continuing, though weakening, composure"]}, {"q": "Discuss whether Banquo's ghost should be read as a real supernatural presence or a symbol of Macbeth's guilt.", "guidance": ["Consider evidence for both interpretations from the text", "Note that only Macbeth can see the ghost"]}, {"q": "Explore the significance of Macbeth's line 'I am in blood / Stepp'd in so far.'", "guidance": ["Consider the imagery of being unable to turn back", "Link to the theme of one crime necessitating further crimes"]}], "essays": [{"q": "Explore how Shakespeare uses the banquet scene to dramatise the public unraveling of Macbeth's authority.", "guidance": ["Analyse the contrast between public performance and private breakdown as a specific technique", "Consider the function of the ghost, whether read literally or symbolically", "Address how this scene marks a turning point in how other characters perceive Macbeth"]}]}, {"id": "m16", "order": 16, "chapter": "Hecate", "stage": "Act 3, Scene 5 — The witches receive their goddess", "summary": "Hecate, goddess of witchcraft, rebukes the three witches for meddling with Macbeth without her involvement and announces her plan to lead him to greater overconfidence through false visions and apparitions, ensuring his eventual destruction. This short scene sets up the more elaborate supernatural spectacle of Act 4.", "vocab": [{"term": "hubris", "def": "Excessive pride or overconfidence, often leading to a tragic downfall."}, {"term": "authorship controversy", "def": "Scholarly debate over whether this scene was written by Shakespeare or added later by another playwright."}, {"term": "foreshadowing", "def": "Hints given early in a narrative about events that will occur later."}], "short_answer": [{"q": "Analyse Hecate's stated plan to manipulate Macbeth through overconfidence.", "guidance": ["Consider what this reveals about the supernatural forces' role in Macbeth's downfall", "Link forward to the apparitions in Act 4"]}, {"q": "Explain the dramatic function of introducing a more formal supernatural hierarchy at this point in the play.", "guidance": ["Consider what this adds to the audience's understanding of the witches' power and limits", "Discuss the effect of the witches themselves being reprimanded"]}, {"q": "Discuss why some scholars question whether this scene was written by Shakespeare.", "guidance": ["Consider the noticeably different verse style and rhyme scheme compared to surrounding scenes", "Reflect on how this might affect how a class chooses to study/perform it"]}, {"q": "Explore the significance of the word 'security' in Hecate's closing lines.", "guidance": ["Consider the specific meaning of overconfidence rather than safety", "Link to how this plays out in Macbeth's response to the apparitions"]}], "essays": [{"q": "By what methods does this scene prepare the audience for Macbeth's response to the apparitions in Act 4?", "guidance": ["Focus on Hecate's stated strategy of inducing false confidence", "Consider how this reframes the audience's expectations of the coming prophecies", "Address the scene's authenticity/authorship question briefly if relevant to your argument"]}]}, {"id": "m17", "order": 17, "chapter": "Lennox's Doubts", "stage": "Act 3, Scene 6 — Growing political opposition", "summary": "Lennox and an unnamed lord discuss recent events with heavy irony, implying without stating outright that they suspect Macbeth of murdering both Duncan and Banquo. They reveal that Macduff has gone to England to seek help from Malcolm and the English court in raising an army against Macbeth, signalling the beginning of organised resistance to his rule.", "vocab": [{"term": "verbal irony", "def": "Saying one thing while meaning, or implying, another — used throughout Lennox's guarded speech."}, {"term": "political resistance", "def": "Organised opposition to a ruler or government, here beginning to form against Macbeth."}, {"term": "exposition (dramatic function)", "def": "Dialogue that conveys necessary background or plot information to the audience."}], "short_answer": [{"q": "Analyse how Lennox uses irony to express suspicion of Macbeth without stating it outright.", "guidance": ["Find a specific ironic phrase describing Macbeth's actions", "Consider why Lennox might choose indirect rather than open criticism"]}, {"q": "Explain the significance of Macduff's journey to England at this point in the play.", "guidance": ["Consider what this represents for the growing opposition to Macbeth", "Link to earlier suspicions about Macduff's loyalty"]}, {"q": "Discuss the function of this scene in advancing the plot without staged action.", "guidance": ["Consider what practical purpose this dialogue-heavy scene serves", "Comment on the pacing effect of a quieter scene after the banquet's chaos"]}, {"q": "Explore what this scene reveals about how Macbeth's reign is perceived by the Scottish nobility.", "guidance": ["Consider specific words used to describe Scotland's suffering under Macbeth", "Link to the play's wider concern with tyranny and legitimate kingship"]}], "essays": [{"q": "Explore how Shakespeare uses indirect speech and irony in this scene to convey growing political opposition to Macbeth.", "guidance": ["Analyse specific examples of verbal irony in Lennox's dialogue", "Consider why open rebellion has not yet been possible or spoken aloud", "Connect this scene's quiet resistance to the more open conflict later in the play"]}]}, {"id": "m18", "order": 18, "chapter": "The Apparitions", "stage": "Act 4, Scene 1 — Macbeth seeks and receives false confidence", "summary": "Macbeth visits the witches again and demands answers; three apparitions warn him to beware Macduff, but also assure him that 'none of woman born' shall harm him and that he is safe until Birnam Wood comes to Dunsinane. Reassured by these seemingly impossible conditions, Macbeth also learns of Banquo's descendants' future kingship in a vision of eight kings, and on hearing that Macduff has fled to England, resolves immediately to have Macduff's family murdered.", "vocab": [{"term": "apparition", "def": "A ghostly or supernatural figure appearing as a vision or omen."}, {"term": "equivocation", "def": "Ambiguous language that misleads by being technically true — central to the apparitions' prophecies."}, {"term": "false security", "def": "A misplaced sense of safety based on a misunderstanding, here of the prophecies' true meaning."}], "short_answer": [{"q": "Analyse how the apparitions' language is deliberately ambiguous.", "guidance": ["Consider the specific wording 'none of woman born' and how it could be misread", "Discuss why Macbeth fails to consider alternative interpretations"]}, {"q": "Explain the significance of the vision of eight kings descended from Banquo.", "guidance": ["Consider Macbeth's reaction to this vision compared to the earlier reassuring prophecies", "Link to his ongoing fear of Banquo's line"]}, {"q": "Discuss Macbeth's decision to have Macduff's family killed immediately after this scene.", "guidance": ["Consider what this reveals about his moral deterioration", "Compare this impulsive violence to his earlier, more calculated murders"]}, {"q": "Explore how this scene demonstrates the danger of overconfidence.", "guidance": ["Consider how the apparitions' reassurances actually increase Macbeth's recklessness", "Link to Hecate's earlier stated plan in Act 3, Scene 5"]}], "essays": [{"q": "By what methods does Shakespeare use equivocation and false reassurance in this scene to advance the play's tragic trajectory?", "guidance": ["Analyse the precise wording of each apparition's prophecy as your primary evidence", "Consider how Macbeth's interpretation reveals his own psychological state (desperate for certainty)", "Address the dramatic irony an audience experiences, sensing the loopholes Macbeth misses"]}]}, {"id": "m19", "order": 19, "chapter": "The Murder of Lady Macduff", "stage": "Act 4, Scene 2 — Innocent victims of tyranny", "summary": "Lady Macduff, confused and hurt by her husband's flight to England, discusses his apparent abandonment with her young son in a rare domestic scene, before Macbeth's murderers arrive and kill both her and the boy. This scene starkly demonstrates Macbeth's escalating tyranny, extending violence now to entirely innocent victims with no political threat of their own.", "vocab": [{"term": "pathos", "def": "A quality that evokes pity or sadness in an audience."}, {"term": "domestic scene", "def": "A scene depicting private, family life, rare and significant in this play dominated by public/political violence."}, {"term": "tyranny", "def": "Cruel, oppressive rule by an unjust ruler, exercised without legitimate restraint."}], "short_answer": [{"q": "Analyse how this scene generates sympathy for Lady Macduff and her son.", "guidance": ["Consider the domestic, tender dialogue between mother and son before the attack", "Discuss the effect of humour or innocence just before violence"]}, {"q": "Explain the significance of the son's witty exchange with his mother about traitors and honest men.", "guidance": ["Consider what this dialogue reveals about the play's exploration of trust and treachery", "Note the child's precocious wisdom despite his age"]}, {"q": "Discuss what this scene reveals about the extent of Macbeth's tyranny by this point in the play.", "guidance": ["Compare the political targets of earlier murders (Duncan, Banquo) to this entirely domestic, innocent target", "Consider what this shift suggests about Macbeth's moral state"]}, {"q": "Explore the dramatic effect of staging violence against a child directly, rather than only reporting it.", "guidance": ["Consider the shock value compared to Duncan's offstage murder", "Discuss how this affects audience sympathy for Macduff later"]}], "essays": [{"q": "Explore how Shakespeare uses this scene to develop the play's presentation of Macbeth as a tyrant.", "guidance": ["Analyse the contrast between this scene's domestic tenderness and its sudden violence", "Consider how this scene differs in kind from Macbeth's earlier, more targeted murders", "Connect this atrocity to Macduff's motivation for revenge later in the play"]}]}, {"id": "m20", "order": 20, "chapter": "Malcolm and Macduff in England", "stage": "Act 4, Scene 3 — Testing loyalty, building an army", "summary": "In England, Malcolm tests Macduff's loyalty by falsely claiming he himself would be an even worse tyrant than Macbeth, before revealing this was a test and that he in fact possesses many kingly virtues. Ross arrives with the devastating news of the murder of Macduff's wife and children, and Macduff's grief transforms into fierce resolve as Malcolm and Macduff prepare to march against Macbeth with English support.", "vocab": [{"term": "kingly virtues", "def": "Qualities traditionally expected of a legitimate, good ruler — justice, temperance, generosity, and more."}, {"term": "foil (character)", "def": "Malcolm's self-restraint and virtue contrast directly with Macbeth's tyranny."}, {"term": "catharsis", "def": "An emotional release, especially of grief, often leading to renewed resolve or action."}], "short_answer": [{"q": "Analyse the purpose of Malcolm's test of Macduff's loyalty.", "guidance": ["Consider why Malcolm feels the need to test rather than simply trust Macduff", "Discuss what this caution reveals about Scotland's political climate under Macbeth"]}, {"q": "Explain the significance of Malcolm's list of 'king-becoming graces.'", "guidance": ["Consider how this list functions as an implicit contrast with Macbeth", "Link to the play's wider concern with legitimate versus illegitimate kingship"]}, {"q": "Discuss how Macduff's grief is dramatised upon hearing of his family's murder.", "guidance": ["Find a specific line expressing his initial disbelief or pain", "Consider Malcolm's advice to 'dispute it like a man' and Macduff's response"]}, {"q": "Explore how this scene marks a turning point in the momentum of the play's plot.", "guidance": ["Consider how personal grief becomes political and military resolve", "Link to the practical alliance being formed against Macbeth"]}], "essays": [{"q": "By what methods does Shakespeare use this scene to define legitimate kingship in contrast to Macbeth's tyranny?", "guidance": ["Analyse Malcolm's list of kingly virtues closely as your central evidence", "Consider the function of Malcolm's test as establishing trust before revealing this contrast", "Address how Macduff's personal grief reinforces the political argument of the scene"]}]}, {"id": "m21", "order": 21, "chapter": "The Sleepwalking Scene", "stage": "Act 5, Scene 1 — Lady Macbeth's guilt surfaces uncontrollably", "summary": "A doctor and gentlewoman observe Lady Macbeth sleepwalking, compulsively trying to wash imagined blood from her hands while muttering fragmented confessions about Duncan, Banquo, and Lady Macduff. Once composed and dominant, she is now consumed by guilt she cannot consciously control, and the doctor concludes her illness is beyond his medical expertise, suggesting only divine forgiveness might help her.", "vocab": [{"term": "psychosomatic", "def": "A physical symptom or behaviour caused or influenced by mental or emotional distress."}, {"term": "dramatic reversal", "def": "A significant, often ironic change in a character's situation or state compared to earlier in the play."}, {"term": "confession (unintentional)", "def": "An involuntary revelation of guilt, here occurring while asleep rather than through deliberate admission."}], "short_answer": [{"q": "Analyse the significance of Lady Macbeth's repeated hand-washing gesture.", "guidance": ["Consider the earlier scene where she claimed 'a little water clears us of this deed'", "Discuss the irony of this earlier confidence now"]}, {"q": "Explain what the fragmented, disjointed nature of Lady Macbeth's speech reveals about her mental state.", "guidance": ["Consider the prose form (rather than verse) used here for the first time for her", "Link to the breakdown of her earlier composure and control"]}, {"q": "Discuss the significance /* ---------- storage helpers ---------- */
function loadJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v||fallback;}catch(e){return fallback;}}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function loadDrafts(){return loadJSON("mbth_drafts",{});}
function saveDraft(id,text){const d=loadDrafts();d[id]=text;saveJSON("mbth_drafts",d);}
function loadDone(){return new Set(loadJSON("mbth_done",[]));}
function saveDone(set){saveJSON("mbth_done",Array.from(set));}

/* ---------- theme ---------- */
function toggleTheme(){
  const b=document.body;
  const now=b.getAttribute("data-theme")==="dark"?"light":"dark";
  b.setAttribute("data-theme",now);
  document.getElementById("themeBtn").textContent=now==="dark"?"🌙":"☀️";
  saveJSON("mbth_theme",now);
}
(function initTheme(){
  const saved=loadJSON("mbth_theme","dark");
  document.body.setAttribute("data-theme",saved);
  document.getElementById("themeBtn").textContent=saved==="dark"?"🌙":"☀️";
})();

/* ---------- nav setup ---------- */
(function initUnitJump(){
  const sel=document.getElementById("unitJump");
  UNITS.forEach(u=>{
    const opt=document.createElement("option");
    opt.value=u.id;
    opt.textContent="Unit "+u.order+" · "+u.chapter;
    sel.appendChild(opt);
  });
})();
(function initStudentName(){
  const n=loadJSON("mbth_name","");
  const el=document.getElementById("studentName");
  if(el)el.value=n;
})();
function setActiveNav(view){
  document.querySelectorAll("#mainNav > button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  document.getElementById("unitJump").value="";
}

/* ---------- item counting for progress ---------- */
function unitItemIds(u){
  const ids=[];
  u.short_answer.forEach((q,i)=>ids.push(u.id+"-sa-"+i));
  u.essays.forEach((q,i)=>ids.push(u.id+"-es-"+i));
  return ids;
}
function unitProgress(u){
  const done=loadDone();
  const ids=unitItemIds(u);
  const doneCount=ids.filter(id=>done.has(id)).length;
  return {done:doneCount,total:ids.length,pct:ids.length?Math.round(doneCount/ids.length*100):0};
}
function overallProgress(){
  const done=loadDone();
  let total=0,doneCount=0;
  UNITS.forEach(u=>{const ids=unitItemIds(u);total+=ids.length;doneCount+=ids.filter(id=>done.has(id)).length;});
  return {done:doneCount,total,pct:total?Math.round(doneCount/total*100):0};
}

/* ---------- Term Overview ---------- */
function goOverview(){
  setActiveNav("overview");
  const c=document.getElementById("content");
  let h="<h2>Term Overview</h2><p style=\"color:var(--muted);margin-bottom:16px\">Work through the units in order across the term — roughly two scenes per week. Each unit has a summary, key vocabulary, short-answer practice, and one essay question.</p>";
  h+='<div class="overview-grid">';
  UNITS.forEach(u=>{
    const p=unitProgress(u);
    h+='<div class="unit-card" onclick="goUnit(\''+u.id+'\')">';
    h+='<div class="unit-num">Unit '+u.order+' of '+UNITS.length+'</div>';
    h+='<h3>'+u.chapter+'</h3>';
    h+='<div class="unit-stage">'+u.stage+'</div>';
    h+='<div class="progress-track"><div class="progress-fill" style="width:'+p.pct+'%"></div></div>';
    h+='<div class="progress-label">'+p.done+' / '+p.total+' items practiced</div>';
    h+='</div>';
  });
  h+="</div>";
  c.innerHTML=h;
}

/* ---------- Unit view ---------- */
function goUnit(id){
  setActiveNav("");
  document.getElementById("unitJump").value=id;
  const u=UNITS.find(x=>x.id===id);
  if(!u)return;
  const drafts=loadDrafts();
  const done=loadDone();
  const idx=UNITS.indexOf(u);
  let h='<button type="button" class="back-btn" onclick="goOverview()">← Term Overview</button>';
  h+='<div class="unit-header"><div><h2>Unit '+u.order+': '+u.chapter+'</h2><div class="unit-stage-big">'+u.stage+'</div></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="toolbar-btn" onclick="exportUnit(\''+u.id+'\')">⬇ Export This Unit (.txt)</button>';
  h+='<button type="button" class="toolbar-btn" onclick="printBlankWorksheet(\''+u.id+'\')">🖨️ Print Blank Worksheet</button></div></div>';
  h+='<h3 style="margin-top:14px">Summary</h3><p style="margin-top:6px;line-height:1.55">'+u.summary+'</p>';
  h+='<h3 style="margin-top:18px">Key Vocabulary</h3><div style="margin-top:8px">';
  u.vocab.forEach(v=>{h+='<span class="vocab-chip"><b>'+v.term+'</b> — '+v.def+'</span>';});
  h+='</div>';

  h+='<h3 style="margin-top:22px">Short-Answer Practice</h3><p style="color:var(--muted);font-size:.85rem;margin-top:4px">Write a focused paragraph (roughly 120–180 words) for each — a clear point, evidence, and explanation. The word count turns green once you\'re in range.</p>';
  u.short_answer.forEach((q,i)=>{
    const qid=u.id+"-sa-"+i;
    const isDone=done.has(qid);
    const draft=drafts[qid]||"";
    h+='<div class="q-card"><div class="q-head"><p class="qtext">'+(i+1)+'. '+q.q+'</p></div>';
    h+="<ul>"+q.guidance.map(g=>"<li>"+g+"</li>").join("")+"</ul>";
    h+='<textarea placeholder="Write your paragraph here…" data-qid="'+qid+'" data-type="sa" oninput="onDraftInput(this)">'+draft+'</textarea>';
    h+='<div class="q-footer"><span class="word-count'+(wcClass(wordCount(draft),"sa"))+'" id="wc-'+qid+'">'+wordCount(draft)+' words (target 120–180)</span>';
    h+='<button type="button" class="mark-btn'+(isDone?' done':'')+'" data-qid="'+qid+'" onclick="toggleDone(this)">'+(isDone?"✓ Practiced":"Mark as Practiced")+'</button></div></div>';
  });

  h+='<h3 style="margin-top:22px">Essay Practice</h3><p style="color:var(--muted);font-size:.85rem;margin-top:4px">Full essay length for your exam board (e.g. roughly 700–900 words for a Cambridge 9695-style response) — plan before you write.</p>';
  u.essays.forEach((q,i)=>{
    const qid=u.id+"-es-"+i;
    const isDone=done.has(qid);
    const draft=drafts[qid]||"";
    h+='<div class="q-card"><p class="qtext">'+q.q+'</p>';
    h+="<ul>"+q.guidance.map(g=>"<li>"+g+"</li>").join("")+"</ul>";
    h+='<div class="essay-target">Target: roughly 700–900 words — plan your structure before drafting in full.</div>';
    h+='<textarea placeholder="Plan or draft your essay here…" data-qid="'+qid+'" data-type="essay" oninput="onDraftInput(this)">'+draft+'</textarea>';
    h+='<div class="q-footer"><span class="word-count'+(wcClass(wordCount(draft),"essay"))+'" id="wc-'+qid+'">'+wordCount(draft)+' words (target 700–900)</span>';
    h+='<button type="button" class="mark-btn'+(isDone?' done':'')+'" data-qid="'+qid+'" onclick="toggleDone(this)">'+(isDone?"✓ Practiced":"Mark as Practiced")+'</button></div></div>';
  });

  h+='<div class="unit-footer-nav">';
  if(idx>0)h+='<button type="button" class="footer-nav-btn" onclick="goUnit(\''+UNITS[idx-1].id+'\')">← Unit '+UNITS[idx-1].order+': '+UNITS[idx-1].chapter+'</button>';else h+='<span></span>';
  if(idx<UNITS.length-1)h+='<button type="button" class="footer-nav-btn" onclick="goUnit(\''+UNITS[idx+1].id+'\')">Unit '+UNITS[idx+1].order+': '+UNITS[idx+1].chapter+' →</button>';else h+='<button type="button" class="footer-nav-btn" onclick="goDashboard()">See My Progress →</button>';
  h+='</div>';

  document.getElementById("content").innerHTML=h;
}
function wordCount(t){t=(t||"").trim();return t?t.split(/\s+/).length:0;}
const WORD_TARGETS={sa:[120,180],essay:[700,900]};
function wcClass(count,type){
  const range=WORD_TARGETS[type];
  if(range&&count>=range[0]&&count<=range[1])return " on-target";
  return "";
}
function onDraftInput(el){
  saveDraft(el.dataset.qid,el.value);
  const wc=document.getElementById("wc-"+el.dataset.qid);
  if(wc){
    const count=wordCount(el.value);
    const type=el.dataset.type;
    const range=WORD_TARGETS[type];
    wc.textContent=count+" words"+(range?" (target "+range[0]+"–"+range[1]+")":"");
    wc.className="word-count"+wcClass(count,type);
  }
}
function toggleDone(btn){
  const done=loadDone();
  const qid=btn.dataset.qid;
  if(done.has(qid)){done.delete(qid);btn.classList.remove("done");btn.textContent="Mark as Practiced";}
  else{done.add(qid);btn.classList.add("done");btn.textContent="✓ Practiced";}
  saveDone(done);
}

/* ---------- Printable blank worksheet ---------- */
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function printBlankWorksheet(unitId){
  const u=UNITS.find(x=>x.id===unitId);
  if(!u)return;
  let html="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>"+esc(u.chapter)+" — Worksheet</title>";
  html+="<style>body{font-family:Georgia,'Times New Roman',serif;color:#111;max-width:800px;margin:30px auto;padding:0 20px;line-height:1.5}";
  html+="h1{font-size:1.4rem;margin-bottom:2px}h2{font-size:1.05rem;margin:26px 0 6px;border-bottom:1px solid #999;padding-bottom:4px}";
  html+=".stage{color:#555;font-size:.95rem;margin-bottom:14px}.q{font-weight:700;margin:16px 0 4px}.guide{font-size:.85rem;color:#444;margin:0 0 6px 18px}";
  html+=".line{border-bottom:1px solid #999;height:26px;margin-bottom:2px}.namefield{margin:14px 0 20px;font-size:.95rem}";
  html+="@media print{.no-print{display:none}}</style></head><body>";
  html+="<div class='no-print' style='text-align:right'><button onclick='window.print()'>Print</button></div>";
  html+="<h1>Macbeth — Unit "+u.order+": "+esc(u.chapter)+"</h1>";
  html+="<div class='stage'>"+esc(u.stage)+"</div>";
  html+="<div class='namefield'>Name: _____________________________&nbsp;&nbsp;&nbsp; Date: _______________</div>";
  html+="<h2>Summary</h2><p>"+esc(u.summary)+"</p>";
  html+="<h2>Key Vocabulary</h2><p>"+u.vocab.map(v=>"<b>"+esc(v.term)+"</b>: "+esc(v.def)).join(" &nbsp;&middot;&nbsp; ")+"</p>";
  html+="<h2>Short-Answer Practice</h2>";
  u.short_answer.forEach((q,i)=>{
    html+="<div class='q'>"+(i+1)+". "+esc(q.q)+"</div>";
    html+="<ul class='guide'>"+q.guidance.map(g=>"<li>"+esc(g)+"</li>").join("")+"</ul>";
    for(let l=0;l<6;l++)html+="<div class='line'></div>";
  });
  html+="<h2>Essay Practice</h2>";
  u.essays.forEach(q=>{
    html+="<div class='q'>"+esc(q.q)+"</div>";
    html+="<ul class='guide'>"+q.guidance.map(g=>"<li>"+esc(g)+"</li>").join("")+"</ul>";
    for(let l=0;l<26;l++)html+="<div class='line'></div>";
  });
  html+="</body></html>";
  const w=window.open("","_blank");
  if(!w){alert("Please allow pop-ups to print the worksheet.");return;}
  w.document.open();w.document.write(html);w.document.close();
}

  let h="<h2>My Progress</h2>";
  h+='<div class="dash-row"><div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+overall.pct+'%"></div></div><div class="dash-pct">'+overall.pct+'%</div></div>';
  h+='<p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">'+overall.done+' of '+overall.total+' short-answer and essay items practiced across the whole term.</p>';
  UNITS.forEach(u=>{
    const p=unitProgress(u);
    h+='<div class="dash-unit-row" onclick="goUnit(\''+u.id+'\')"><div class="dash-unit-name">Unit '+u.order+' · '+u.chapter+'</div><div class="dash-bar-track"><div class="dash-bar-fill" style="width:'+p.pct+'%"></div></div><div class="dash-pct">'+p.pct+'%</div></div>';
  });
  h+='<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">';
  h+='<button type="button" class="toolbar-btn" onclick="exportAnswers()">⬇ Export My Answers (.txt)</button>';
  h+='<button type="button" class="toolbar-btn" onclick="backupProgress()">💾 Backup Progress (.json)</button>';
  h+='<button type="button" class="toolbar-btn" onclick="document.getElementById(\'restoreFileInput\').click()">⬆ Restore from Backup</button>';
  h+='<input type="file" id="restoreFileInput" accept="application/json" style="display:none" onchange="restoreProgress(this)">';
  h+='<button type="button" class="danger-btn" onclick="resetProgress()">Reset All Progress</button>';
  h+='</div>';
  h+='<p style="color:var(--muted);font-size:.78rem;margin-top:10px">Progress is saved only in this browser on this device. Back up regularly (especially before clearing your browser data or switching devices) and restore the file here if you need to bring it back.</p>';
  document.getElementById("content").innerHTML=h;
}
function backupProgress(){
  const payload={
    app:"macbeth-term-practice",
    exported:new Date().toISOString(),
    name:loadJSON("mbth_name",""),
    drafts:loadDrafts(),
    done:Array.from(loadDone())
  };
  downloadText(JSON.stringify(payload,null,2),"macbeth-term-practice-backup.json");
}
function restoreProgress(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let data;
    try{data=JSON.parse(e.target.result);}catch(err){alert("This doesn't look like a valid backup file.");return;}
    if(!data||typeof data!=="object"||!data.drafts){alert("This doesn't look like a valid backup file.");return;}
    if(!confirm("Restoring will replace your current progress on this device with the backup. Continue?"))return;
    saveJSON("mbth_drafts",data.drafts||{});
    saveJSON("mbth_done",data.done||[]);
    if(data.name){saveJSON("mbth_name",data.name);const el=document.getElementById("studentName");if(el)el.value=data.name;}
    input.value="";
    goDashboard();
    alert("Progress restored.");
  };
  reader.readAsText(file);
}
function exportAnswers(){
  const drafts=loadDrafts();
  const done=loadDone();
  const name=loadJSON("mbth_name","");
  let out="MACBETH — TERM PRACTICE\n";
  if(name)out+="Student: "+name+"\n";
  out+="Exported "+new Date().toLocaleDateString()+"\n\n";
  UNITS.forEach(u=>{
    out+=unitExportBlock(u,drafts,done);
  });
  downloadText(out,"macbeth-term-practice-answers.txt");
}
function exportUnit(unitId){
  const u=UNITS.find(x=>x.id===unitId);
  if(!u)return;
  const drafts=loadDrafts();
  const done=loadDone();
  const name=loadJSON("mbth_name","");
  let out="MACBETH — TERM PRACTICE\n";
  if(name)out+="Student: "+name+"\n";
  out+="Unit "+u.order+" of "+UNITS.length+" — Submitted "+new Date().toLocaleDateString()+"\n\n";
  out+=unitExportBlock(u,drafts,done);
  const safeChapter=u.chapter.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  downloadText(out,"unit-"+u.order+"-"+safeChapter+(name?"-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""):"")+".txt");
}
function unitExportBlock(u,drafts,done){
  let out="========================================\nUNIT "+u.order+": "+u.chapter.toUpperCase()+" ("+u.stage+")\n========================================\n\n";
  u.short_answer.forEach((q,i)=>{
    const qid=u.id+"-sa-"+i;
    out+="Short Answer "+(i+1)+": "+q.q+"\n";
    out+="[ "+(done.has(qid)?"Practiced":"Not marked practiced")+" ]\n";
    out+=(drafts[qid]&&drafts[qid].trim()?drafts[qid].trim():"(no answer written yet)")+"\n\n";
  });
  u.essays.forEach((q,i)=>{
    const qid=u.id+"-es-"+i;
    out+="Essay: "+q.q+"\n";
    out+="[ "+(done.has(qid)?"Practiced":"Not marked practiced")+" ]\n";
    out+=(drafts[qid]&&drafts[qid].trim()?drafts[qid].trim():"(no answer written yet)")+"\n\n";
  });
  return out;
}
function downloadText(text,filename){
  const blob=new Blob([text],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function resetProgress(){
  if(!confirm("This clears all practiced marks and written answers on this device. This cannot be undone. Continue?"))return;
  localStorage.removeItem("mbth_drafts");
  localStorage.removeItem("mbth_done");
  goDashboard();
}

/* ---------- init ---------- */
goOverview();
</script>
</body>
</html>
